<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAC</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, precise work tool — a shipped help-desk product, not a mock.
   IDEA: an operator's switchboard: two phone lines (7987, 8557) routing calls to people.
   PICTURE: the working inbox itself — list, conversation, details — is the picture.
   COLOUR and TYPE: black and white plus one mint field; Space Grotesk 700 titles, Inter body.
   LAYOUT: dark rail, three working columns; stacks to list/chat with a bottom bar on phones. */
:root{color-scheme:light dark;--bg:light-dark(#fff,#0f1012);--panel:light-dark(#f4f4f2,#17181b);--panel2:light-dark(#ebebe8,#202126);--ink:light-dark(#0b0b0c,#f2f2f0);--mute:light-dark(#66666c,#9b9ba3);--line:light-dark(#e3e3df,#2a2b30);--mint:#b8f5d0;--mintInk:#0b3d24;--rail:#0b0b0c;--bad:#d4382a;--h:'Space Grotesk',system-ui,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button{cursor:pointer;border:0;background:none}
.btn{min-height:40px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--panel)}
.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}.pri:hover{background:var(--ink);opacity:.88}
.bad{color:var(--bad)}
.mute{color:var(--mute)}
h1{font:700 32px/1.05 var(--h);margin:0 0 6px;text-wrap:balance}
h2{font:700 19px/1.2 var(--h);margin:0 0 12px}
label.f{display:block;font-size:13px;color:var(--mute);margin:0 0 12px}label.f>input,label.f>select,label.f>textarea{margin-top:4px;color:var(--ink)}
.chk{display:flex;gap:14px;flex-wrap:wrap;margin:4px 0 14px}.chk label{display:flex;gap:6px;align-items:center;font-size:14px}.chk input{width:auto}
.tag{display:inline-block;font:600 12px/1 Inter;padding:4px 7px;border-radius:6px;white-space:nowrap}
.l7987{background:var(--mint);color:var(--mintInk)}.l8557{background:var(--ink);color:var(--bg)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line);margin-right:6px;vertical-align:1px}.dot.on{background:#1fbf6a}
/* login */
#login{min-height:100%;display:grid;grid-template-columns:1fr 1fr}
#login .side{background:var(--rail);color:#f2f2f0;padding:clamp(28px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:32px;overflow:hidden}
#login .side h1{font-size:clamp(36px,4.4vw,52px);color:#fff}
.board{display:grid;gap:12px;max-width:440px}
.jack{display:flex;align-items:center;gap:14px;background:#17181b;border:1px solid #26272c;border-radius:14px;padding:14px 16px}
.jack b{font:700 26px var(--h)}.jack span{color:#9b9ba3;font-size:14px}
.jack i{margin-left:auto;width:14px;height:14px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 6px #b8f5d022;animation:pulse 2.4s infinite}
.jack:nth-child(2) i{animation-delay:1.2s}
@keyframes pulse{50%{box-shadow:0 0 0 12px #b8f5d000}}
@media(prefers-reduced-motion:reduce){.jack i{animation:none}}
#login form{align-self:center;justify-self:center;width:min(380px,90vw);padding:32px 0}
.err{color:var(--bad);font-size:14px;min-height:21px;margin:4px 0 8px}
/* app */
#app{height:100%;display:grid;grid-template-columns:72px minmax(0,1fr)}
.rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px}
.logo{font:700 15px var(--h);color:var(--rail);background:var(--mint);width:42px;height:42px;border-radius:12px;display:grid;place-items:center;margin-bottom:14px}
.nb{width:52px;height:52px;border-radius:12px;color:#9b9ba3;display:grid;place-items:center;position:relative}
.nb svg{width:22px;height:22px}
.nb:hover{color:#fff;background:#1c1d21}.nb.on{color:var(--rail);background:var(--mint)}
.nb .cnt{position:absolute;top:5px;right:5px;background:#fff;color:#000;font:600 11px/1 Inter;padding:3px 5px;border-radius:9px}
.nb[title]::after{content:attr(title);position:absolute;left:62px;background:#000;color:#fff;font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s}
.nb:hover::after{opacity:1}
.meb{margin-top:auto;width:42px;height:42px;border-radius:50%;background:#26272c;color:#fff;font:600 14px Inter;display:grid;place-items:center}
.view{height:100%;overflow:auto}.view[hidden]{display:none}
.pad{padding:clamp(20px,3vw,40px) max(3vw,16px)}
/* inbox */
.work{display:grid;grid-template-columns:330px minmax(0,1fr) 290px;height:100%;overflow:hidden}
.list{border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;background:var(--panel)}
.lh{padding:16px 16px 10px}.lh h2{margin:0 0 10px;display:flex;align-items:center;gap:8px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{padding:6px 10px;border-radius:8px;font-size:13px;font-weight:500;color:var(--mute);min-height:32px}
.tabs button.on{background:var(--ink);color:var(--bg)}
.tabs button span{opacity:.7;margin-left:3px}
#chatList{overflow:auto;flex:1;padding:0 8px 8px}
.ci{display:flex;gap:10px;width:100%;text-align:left;padding:11px 10px;border-radius:12px;margin-bottom:2px}
.ci:hover{background:var(--panel2)}.ci.on{background:var(--bg);box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font:600 13px Inter}
.ci .av{background:var(--bg);border:1px solid var(--line)}
.cm{flex:1;display:grid;gap:2px}
.r1{display:flex;justify-content:space-between;gap:8px}.r1 b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.r1 time{font-size:12px;color:var(--mute)}
.r2{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r3{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mute);flex-wrap:wrap}
.wait{font:600 12px Inter;font-variant-numeric:tabular-nums;padding:3px 6px;border-radius:6px;background:var(--panel2);color:var(--ink)}
.wait.hot{background:var(--bad);color:#fff}
.empty{padding:40px 20px;text-align:center;color:var(--mute);font-size:14px}
.chat{display:flex;flex-direction:column;overflow:hidden}
.ch{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:66px}
.ch .who{flex:1;display:grid}.ch .who b{font-weight:600}.ch .who span{font-size:13px;color:var(--mute)}
.ch .acts{display:flex;gap:6px;flex-wrap:wrap}
.back{display:none}
#msgs{flex:1;overflow:auto;padding:20px clamp(12px,3vw,36px);display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.m{width:fit-content;flex:none;max-width:min(560px,82%);padding:9px 13px;border-radius:14px;background:var(--panel);align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--mint);color:var(--mintInk)}
.m small{display:block;font-size:11px;opacity:.65;margin-top:3px}
.m img{display:block;max-width:100%;max-height:260px;border-radius:10px;margin-bottom:6px}
.fc{display:flex;gap:8px;align-items:center;padding:8px 10px;background:#ffffff66;border-radius:10px;margin-bottom:6px;color:inherit;text-decoration:none;font-size:14px}
.sys{align-self:center;font-size:12px;color:var(--mute);background:var(--panel);padding:4px 10px;border-radius:20px;text-align:center;max-width:90%}
.comp{border-top:1px solid var(--line);padding:10px 14px 14px;position:relative}
.tools{display:flex;gap:6px;margin-bottom:8px}
.tb{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 11px;border-radius:9px;font-size:13px;font-weight:500;background:var(--panel);cursor:pointer}
.tb svg{width:16px;height:16px}
.crow{display:flex;gap:8px;align-items:flex-end}.crow textarea{min-height:48px;max-height:180px}
.crow .pri{min-height:48px}
#att:not(:empty){margin-bottom:8px}
.chip{display:inline-flex;gap:8px;align-items:center;background:var(--panel);padding:6px 10px;border-radius:8px;font-size:13px}
.note{padding:14px 16px;border-top:1px solid var(--line);font-size:14px;color:var(--mute);background:var(--panel)}
#pop{position:absolute;bottom:calc(100% - 4px);left:14px;width:min(380px,calc(100% - 28px));max-height:420px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px #0003;padding:14px;z-index:5}
.sc{display:flex;gap:4px;align-items:center;border-radius:10px}.sc:hover{background:var(--panel)}
.sc>button:first-child{flex:1;text-align:left;padding:8px 10px}.sc>button:first-child b{display:block;font-weight:600;font-size:14px}.sc>button:first-child span{font-size:12px;color:var(--mute);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--mute);flex:none}.ib:hover{background:var(--panel2);color:var(--ink)}.ib svg{width:16px;height:16px}
.info{border-left:1px solid var(--line);overflow:auto;padding:20px 18px}
.info .big{width:64px;height:64px;font-size:20px;margin-bottom:10px}
dl{margin:16px 0 0;display:grid;gap:12px}dt{font-size:12px;color:var(--mute)}dd{margin:0;font-weight:500;overflow-wrap:anywhere}
/* tables & cards */
.card{border:1px solid var(--line);border-radius:16px;padding:20px;background:var(--bg)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;margin-top:20px;align-items:start}
.tw{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:16px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;font-weight:500;color:var(--mute);background:var(--panel)}tr:last-child td{border-bottom:0}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.ta{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.ta .btn{min-height:34px;padding:5px 10px;font-size:13px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.stat{background:var(--panel);border-radius:14px;padding:14px 18px;min-width:150px}.stat b{display:block;font:700 30px/1.1 var(--h)}.stat span{font-size:13px;color:var(--mute)}
.stat.mint{background:var(--mint);color:var(--mintInk)}.stat.mint span{color:var(--mintInk)}
.hdr{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap}
/* guide */
.lang{display:flex;gap:4px;flex-wrap:wrap;background:var(--panel);padding:4px;border-radius:12px;width:fit-content}
.lang button{min-height:38px;padding:6px 14px;border-radius:9px;font-weight:500;color:var(--mute)}.lang button.on{background:var(--ink);color:var(--bg)}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;margin:26px 0 8px;background:var(--rail);border-radius:20px;padding:26px}
.node{position:relative;background:#17181b;border:1px solid #2a2b30;border-radius:14px;padding:16px;color:#f2f2f0;font-weight:500;font-size:14px;display:grid;gap:10px}
.node svg{width:26px;height:26px;color:var(--mint)}
.node:not(:last-child)::after{content:'';position:absolute;right:-22px;top:50%;width:16px;height:2px;background:var(--mint)}
.node:not(:last-child)::before{content:'';position:absolute;right:-23px;top:calc(50% - 4px);border:5px solid transparent;border-left-color:var(--mint);border-right:0}
.node.hl{background:var(--mint);color:var(--mintInk);border-color:var(--mint)}.node.hl svg{color:var(--mintInk)}
.steps{display:grid;gap:14px;margin-top:22px}
.step{display:grid;grid-template-columns:56px minmax(0,1fr);gap:16px;border:1px solid var(--line);border-radius:16px;padding:20px}
.step .no{font:700 32px/1 var(--h)}.step p{margin:0 0 10px;max-width:72ch}
.whob{display:inline-block;background:var(--panel);border-radius:8px;padding:6px 10px;font-size:14px}.whob b{font-weight:600}
.opt{font-size:12px;color:var(--mute);font-weight:500;margin-left:6px}
pre.code{background:var(--rail);color:#e9e9e6;border-radius:14px;padding:16px 18px;margin:0;overflow-x:auto;font:13px/1.6 ui-monospace,Menlo,Consolas,monospace}
pre.code .c{color:#8a8a92}pre.code .a{color:var(--mint)}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}
.cols ul{margin:0;padding-left:18px}.cols li{margin-bottom:6px;font-size:15px}
.cols .card h2{font-size:16px;display:flex;align-items:center;gap:8px}
.ask{margin-top:18px;background:var(--mint);color:var(--mintInk);border-radius:16px;padding:18px 20px;font-weight:500}
#v-integracao>*{max-width:1100px}
@media(max-width:900px){.flow{grid-template-columns:1fr 1fr}.node:nth-child(2)::after,.node:nth-child(2)::before{display:none}.cols{grid-template-columns:1fr}}
@media(max-width:520px){.flow{grid-template-columns:1fr;gap:22px;padding:18px}.node::after,.node::before{display:none!important}.step{grid-template-columns:1fr;gap:6px}}
/* demo game site + widget */
#site{min-height:100%;background:#0d0f1a;color:#eef0f7;font-family:Inter,system-ui,sans-serif}
#site.l8557{background:#120d10}
.simbar{background:var(--mint);color:var(--mintInk);font-size:14px;padding:8px 16px;text-align:center}
.simbar a{color:inherit;font-weight:600;margin-left:8px}
.sh{display:flex;align-items:center;gap:24px;padding:16px max(4vw,16px);border-bottom:1px solid #ffffff14;flex-wrap:wrap}
.brand{font:700 20px var(--h);display:flex;align-items:center;gap:10px}
.brand i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#7c8cff,#3dd6c4);display:block}
#site.l8557 .brand i{background:linear-gradient(135deg,#ff8a5c,#ffd25c)}
.sh nav{display:flex;gap:18px;font-size:14px;color:#a9adc2;flex-wrap:wrap}.sh nav b{color:#fff;font-weight:600}
.pl{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;background:#ffffff0f;padding:6px 12px 6px 6px;border-radius:30px}
.pl span{width:28px;height:28px;border-radius:50%;background:#ffffff22;display:grid;place-items:center;font-size:12px;font-weight:600}
.hero{margin:24px max(4vw,16px);border-radius:24px;min-height:240px;padding:clamp(24px,4vw,48px);position:relative;overflow:hidden;background:linear-gradient(120deg,#26307a,#11163a 60%);display:flex;flex-direction:column;justify-content:flex-end}
#site.l8557 .hero{background:linear-gradient(120deg,#7a2f26,#3a1411 60%)}
.hero h2{font:700 clamp(28px,4vw,46px)/1.05 var(--h);margin:0 0 8px;max-width:14ch;position:relative}
.hero p{margin:0;color:#c9cde0;max-width:40ch;position:relative}
.hero .orb{position:absolute;border-radius:50%;filter:blur(2px)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:0 max(4vw,16px) 120px}
.tile{aspect-ratio:4/5;border-radius:18px;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;font-weight:600;position:relative;overflow:hidden}
.tile small{display:block;font-weight:400;opacity:.75;font-size:12px}
.tile svg{position:absolute;top:14px;right:14px;width:56px;height:56px;opacity:.9}
.sect{padding:0 max(4vw,16px);font:700 20px var(--h);margin:8px 0 14px}
/* widget */
.wb{position:fixed;right:22px;bottom:22px;width:62px;height:62px;border-radius:50%;background:var(--mint);color:var(--mintInk);display:grid;place-items:center;box-shadow:0 10px 30px #0006;z-index:40}
.wb svg{width:28px;height:28px}.wb .cnt{position:absolute;top:-2px;right:-2px;background:var(--bad);color:#fff;font:600 12px/1 Inter;padding:4px 7px;border-radius:12px}
.wp{position:fixed;right:22px;bottom:96px;width:min(370px,calc(100vw - 24px));height:min(560px,calc(100vh - 120px));background:#fff;color:#0b0b0c;border-radius:20px;box-shadow:0 20px 60px #0008;display:flex;flex-direction:column;overflow:hidden;z-index:40;color-scheme:light}
.wh{background:#0b0b0c;color:#fff;padding:16px 18px;display:flex;align-items:center;gap:12px}
.wh b{display:block;font:700 17px var(--h)}.wh span{font-size:13px;color:#b5b5bd}
.wh .ib{color:#fff;margin-left:auto}.wh .ib:hover{background:#ffffff1a;color:#fff}
.wbody{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:#f4f4f2}
.wm{max-width:82%;width:fit-content;flex:none;padding:9px 12px;border-radius:14px;background:#fff;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;box-shadow:0 1px 0 #e3e3df}
.wm.p{align-self:flex-end;background:var(--mint);color:var(--mintInk)}
.wm small{display:block;font-size:11px;opacity:.6;margin-top:2px}
.wm img{display:block;max-width:100%;border-radius:8px;margin-bottom:4px}
.wsys{align-self:center;font-size:12px;color:#66666c;text-align:center}
.wf{padding:12px;border-top:1px solid #e3e3df;display:flex;gap:8px;align-items:flex-end;background:#fff}
.wf textarea,.wstart input,.wstart textarea{background:#fff;color:#0b0b0c;border-color:#d8d8d4}
.wf textarea{min-height:44px;max-height:120px}
.wf .pri,.wstart .pri,.wend .pri{background:#0b0b0c;color:#fff;border-color:#0b0b0c}
.wstart{padding:18px;overflow:auto;flex:1;background:#fff}.wstart label.f{color:#66666c}
.wend{padding:14px;border-top:1px solid #e3e3df;text-align:center;font-size:14px;color:#66666c;background:#fff}
@media(max-width:600px){.sh nav{display:none}.wp{right:12px;bottom:90px}.wb{right:14px;bottom:14px}}
/* modal & toast */
#modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:16px;z-index:20}#modal[hidden]{display:none}
.mbox{background:var(--bg);border-radius:18px;padding:24px;width:min(460px,100%);max-height:90vh;overflow:auto}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.pick{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:12px;text-align:left;border:1px solid var(--line);margin-bottom:8px}.pick:hover{background:var(--panel)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90vw}#toast[hidden]{display:none}
#warn{background:var(--bad);color:#fff;font-size:13px;padding:6px 12px;text-align:center}
@media(max-width:1180px){.work{grid-template-columns:300px minmax(0,1fr)}.info{display:none}}
@media(max-width:760px){
 #login{grid-template-columns:1fr}#login .side{padding:28px 20px}.board{display:none}
 #app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 62px}
 .rail{order:2;flex-direction:row;justify-content:space-around;padding:5px 8px}.logo{display:none}.meb{margin:0}.nb[title]::after{display:none}
 .work{grid-template-columns:1fr}.work .chat{display:none}.work.mc .list{display:none}.work.mc .chat{display:flex}.back{display:grid}
 table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 14px;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;color:var(--mute)}.stack td:empty{display:none}.ta{justify-content:flex-start}
}
/* settings */
.set{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px;margin-top:20px;max-width:1100px;align-items:start}
.set>.card:first-child{grid-column:1/-1}
.langs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lc{border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;min-height:56px;font-weight:600;font-size:16px}

let SKEW=0;const MAXF=NET?10*1024*1024:1.5*1024*1024;const siteHref=l=>NET?'/demo/'+encodeURIComponent(l):'#site-'+l;
const K='sac_db_v1',$=s=>document.querySelector(s),now=()=>Date.now()+SKEW;
const LANGS=[['pt','Português','pt-BR'],['en','English','en-US'],['vi','Tiếng Việt','vi-VN'],['ur','Roman Urdu','en-GB'],['zh','中文','zh-CN']];
const D={};LANGS.slice(1).forEach(([k],i)=>{D[k]={};for(const r of ROWS)if(r[i+1])D[k][r[0]]=r[i+1]});
let lang=(()=>{try{const v=localStorage.getItem('sac_lang');return LANGS.some(l=>l[0]===v)?v:'pt'}catch(e){return 'pt'}})();
const t=(k,p,L=lang)=>{let s=(L!=='pt'&&D[L]&&D[L][k])||k;if(p)for(const x in p)s=s.split('{'+x+'}').join(p[x]);return s};
const loc=()=>LANGS.find(l=>l[0]===lang)[2];
const RL={god:'Acesso total',admin:'Admin',supervisor:'Supervisor',agent:'Agente'};
const rl=r=>t(RL[r]);
const DEFLINES=[{id:'7987',name:'7987.com',color:'mint'},{id:'8557',name:'8557.com',color:'ink'}];
const COL={mint:['#b8f5d0','#0b3d24','#1f6b5a'],ink:['var(--ink)','var(--bg)','#26307a'],lilac:['#d9ccff','#2a1a66','#4b2a8a'],peach:['#ffd6b8','#5a2a0b','#7a2f26'],sky:['#c7e4ff','#0b2f5a','#1b4f8a'],sun:['#fff0a8','#4a3c00','#7a5a12'],rose:['#ffc9dc','#5a0b2a','#7a1f4a'],stone:['#e3e3df','#0b0b0c','#3a3b40']};
const LS=()=>(db&&db.lines)||DEFLINES;
const LINES=()=>LS().map(l=>l.id);
const LN=id=>LS().find(l=>l.id===id);
let mem=null,db=null,me=null,view='atendimento',tab=null,sel=null,pend=null,editSc=null,known=new Set();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm=x=>new Date(x).toLocaleTimeString(loc(),{hour:'2-digit',minute:'2-digit'});
const dt=x=>new Date(x).toLocaleString(loc(),{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const ini=n=>String(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const uid=()=>Math.random().toString(36).slice(2,9)+now().toString(36).slice(-4);
const fmtT=s=>s>=60&&s%60===0?`${s/60} min`:`${s} s`;
const tagL=l=>{const x=LN(l),c=COL[x?.color]||COL.stone;return `<span class="tag" style="background:${c[0]};color:${c[1]}" title="${esc(x?.name||l)}">${esc(l)}</span>`};
const csub=c=>c.customer.phone||(c.customer.pid?t('ID do jogador: {id}',{id:c.customer.pid}):t('Via site'));
const X='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>';
let lsOK=true;
function load(){try{const s=localStorage.getItem(K);if(s)return JSON.parse(s)}catch(e){lsOK=false}return mem?JSON.parse(JSON.stringify(mem)):null}
function save(d){mem=d;try{localStorage.setItem(K,JSON.stringify(d))}catch(e){if(e&&e.name==='QuotaExceededError')toast(t('Armazenamento cheio. Anexos grandes ocupam espaço.'));else lsOK=false}}
let sidMem=null;
function getSid(){try{return sessionStorage.getItem('sac_uid')}catch(e){return sidMem}}
function setSid(v){sidMem=v;try{v?sessionStorage.setItem('sac_uid',v):sessionStorage.removeItem('sac_uid')}catch(e){}}
async function hash(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('sac|'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of 'sac|'+p)h=((h*33)^c.charCodeAt(0))>>>0;return 'x'+h.toString(16)}}
const U=(d,id)=>d.users.find(u=>u.id===id);
const ME=()=>U(db,me);
function online(d,u){const s=u&&d.sessions[u.id];return !!(s&&s.on&&!s.kick&&now()-s.lastSeen<20000)}
const openOf=(d,id)=>d.chats.filter(c=>c.status==='open'&&c.agentId===id).length;
const onAgents=(d,line,ex)=>d.users.filter(u=>u.role==='agent'&&u.lines.includes(line)&&u.id!==ex&&online(d,u));
const pick=(d,line,ex)=>freeAgents(d,line,ex).filter(u=>!(d.cfg.maxChats>0&&openOf(d,u.id)>=d.cfg.maxChats)).sort((a,b)=>openOf(d,a.id)-openOf(d,b.id))[0];
function sys(c,k,p){c.msgs.push({id:uid(),from:'system',k,p:p||{},at:now()})}
const sysText=m=>m.k?t(m.k,m.p):m.text;
function assign(c,u,k,p){c.agentId=u?u.id:null;if(u){c.assignedAt=now();if(!c.handled.includes(u.id))c.handled.push(u.id)}if(c.waiting)c.waiting=now();sys(c,k,p)}
function maintain(d){let ch=false;const T=(d.cfg.timeout||240)*1000;
 for(const c of d.chats){if(c.status!=='open')continue;
  if(c.agentId&&!online(d,U(d,c.agentId))){const u=U(d,c.agentId),n=pick(d,c.line,c.agentId),a=u?u.name:'—';
   n?assign(c,n,'{a} ficou offline. Chat transferido para {b}.',{a,b:n.name}):assign(c,null,'{a} ficou offline. Chat voltou para a fila da linha {l}.',{a,l:c.line});ch=true;continue}
  if(c.agentId&&c.waiting&&now()-c.waiting>=T){const n=pick(d,c.line,c.agentId);if(n){const u=U(d,c.agentId);assign(c,n,'Sem resposta de {a} em {t}. Transferido automaticamente para {b}.',{a:u?u.name:'—',t:fmtT(d.cfg.timeout),b:n.name});c.transfers=(c.transfers||0)+1;ch=true}}
  if(!c.agentId){const n=pick(d,c.line);if(n){assign(c,n,'Atribuído a {b}.',{b:n.name});ch=true}}
 }return ch}
function nextNo(d){d.chatSeq=(d.chatSeq??-1)+1;return d.chatSeq}
function tx(fn){const d=load()||db;const r=fn(d);save(d);db=d;render();return r}

/* permissions */
const role=()=>ME()?.role;
const isBoss=()=>['god','admin','supervisor'].includes(role());
const isTop=()=>['god','admin'].includes(role());
function canEdit(x){const r=role();return r==='god'||(r==='admin'&&x.role!=='god')}
function canPass(x){const r=role();return canEdit(x)||(r==='supervisor'&&x.role==='agent')}
function canKick(x){if(x.id===me||!online(db,x))return false;const r=role();return r==='god'||(r==='admin'&&x.role!=='god')||(r==='supervisor'&&x.role==='agent')}
function canAct(c){if(c.status!=='open')return false;const u=ME();if(u.role==='agent')return c.agentId===me;return u.role!=='supervisor'||u.lines.includes(c.line)}
function canReply(c){return c.status==='open'&&(c.agentId===me||(isBoss()&&canAct(c)))}
function visible(c){const u=ME();if(u.role==='agent')return c.agentId===me||c.handled.includes(me);if(u.role==='supervisor')return u.lines.includes(c.line);return true}

/* ---------- login / session ---------- */
function showLogin(msg){$('#app').hidden=true;$('#site').hidden=true;buildLogin();$('#login').hidden=false;$('#lErr').textContent=msg||''}
async function doLogin(){const em=$('#lEmail').value.trim().toLowerCase(),h=await hash($('#lPass').value);const d=load()||db;const u=d.users.find(x=>x.email===em);
 if(!u||u.pass!==h){$('#lErr').textContent=t('E-mail ou senha incorretos.');return}
 me=u.id;setSid(me);d.sessions[me]={on:true,lastSeen:now(),kick:false};
 if(u.lang)setLang(u.lang);else u.lang=lang;
 maintain(d);save(d);db=d;known=new Set(d.chats.filter(c=>c.agentId===me).map(c=>c.id));enter()}
function enter(){const u=ME();if(u.lang&&u.lang!==lang)setLang(u.lang);document.documentElement.lang=loc();$('#login').hidden=true;$('#site').hidden=true;IN.folder=u.role==='agent'?'mine':'team';IN.qtab='all';view='atendimento';sel=null;buildApp();$('#app').hidden=false;render()}
function logout(msg){document.title='SAC';if(typeof AL!=='undefined'){AL.seen.clear();AL.ack.clear()}const d=load();if(d&&me&&d.sessions[me]){d.sessions[me].on=false;d.sessions[me].kick=false;maintain(d);save(d);db=d}me=null;setSid(null);sel=null;pend=null;mclose();showLogin(msg)}

/* ---------- render ---------- */
function render(){if(!me)return;db=db||load();const u=ME();if(!u)return logout(t('Seu acesso foi removido.'));
 if(!NET){$('#warn').hidden=lsOK;$('#warn').textContent=t('Modo temporário: este navegador não permite salvar dados. Tudo some ao recarregar.')}
 $('#meBtn').textContent=ini(u.name);renderStatus();
 $('#nav-usuarios').hidden=!isBoss();$('#nav-integracao').hidden=!isTop();$('#nav-alertas').hidden=!isSup();
 if((view==='alertas'&&!isSup())||(view==='integracao'&&!isTop())||(view==='usuarios'&&!isBoss()))view='atendimento';
 document.querySelectorAll('.nb').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
 document.querySelectorAll('#app .view').forEach(v=>v.hidden=v.id!=='v-'+view);
 const mine=db.chats.filter(c=>c.status==='open'&&(u.role==='agent'?c.agentId===me:visible(c))).length;
 $('#cntOpen').hidden=!mine;$('#cntOpen').textContent=mine;
 for(const c of db.chats)if(c.status==='closed'&&c.closedBy==='customer'&&c.agentId===me&&known.has(c.id)){known.delete(c.id);toast(t('{n} encerrou o chat.',{n:c.customer.name}))}
 for(const c of db.chats)if(c.status==='open'&&c.agentId===me&&!known.has(c.id)){known.add(c.id);if(!mutedSet().has(c.id))toast(t('Novo chat: {n} (linha {l})',{n:c.customer.name,l:c.line}))}
 if(view==='atendimento'){renderList();renderChat();renderInfo()}
 if(view==='equipe')renderTeam();
 if(view==='usuarios')renderUsers();
 if(view==='simulador')renderSim();
 if(view==='integracao'){const k=lang+JSON.stringify(LS());if($('#guide').dataset.k!==k){$('#guide').dataset.k=k;renderGuide()}}
 if(view==='alertas')renderAlerts();
 if(view==='config'){renderNs();$('#fMax').hidden=!isTop();if(document.activeElement!==$('#cfgM'))$('#cfgM').value=db.cfg.maxChats||0;$('#fCfg').hidden=!isTop();$('#fAlert').hidden=!isTop();if(document.activeElement!==$('#cfgA'))$('#cfgA').value=db.cfg.alert||300;$('#linesCard').hidden=!isTop();if(isTop())renderLines();if(document.activeElement!==$('#cfgT'))$('#cfgT').value=db.cfg.timeout}}

const last=c=>c.msgs.filter(m=>m.from!=='system').slice(-1)[0]||c.msgs.slice(-1)[0]||{at:c.createdAt,text:''};
function waitPill(c){if(c.status!=='open')return '';if(!c.agentId)return `<span class="wait">${t('Na fila')}</span>`;if(!c.waiting)return '';
 const r=Math.max(0,(db.cfg.timeout*1000)-(now()-c.waiting)),s=Math.ceil(r/1000);return `<span class="wait ${s<=60?'hot':''}">${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}</span>`}
function renderChat(){const c=db.chats.find(x=>x.id===sel);$('#work').classList.toggle('mc',!!c);

 const a=c.agentId&&U(db,c.agentId),act=canAct(c);

/* ---------- supervisor alerts ---------- */
const AL={ac:null,seen:new Set(),ack:new Set(),lastBeep:0};
const isSup=()=>['supervisor','god'].includes(role());
const waitStart=c=>c.custWait??c.waiting;
const fmtDur=ms=>{const s=Math.max(0,Math.floor(ms/1000));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
const soundPref=()=>{try{return localStorage.getItem('sac_sound')==='1'}catch(e){return false}};
function alertsOf(d){if(!me)return[];const u=U(d,me);if(!u||!['supervisor','god'].includes(u.role))return[];const T=(d.cfg.alert||300)*1000;
 return d.chats.filter(c=>c.status==='open'&&(u.role==='god'||u.lines.includes(c.line))&&waitStart(c)&&now()-waitStart(c)>=T).sort((a,b)=>waitStart(a)-waitStart(b))}
function audioOn(){try{if(!AL.ac)AL.ac=new (window.AudioContext||window.webkitAudioContext)();if(AL.ac.state==='suspended')AL.ac.resume();return true}catch(e){return false}}
function beep(times=3){if(!AL.ac||AL.ac.state!=='running')return;const ac=AL.ac;let t0=ac.currentTime+.02;
 for(let i=0;i<times;i++){for(const [f,dl] of [[880,0],[660,.16]]){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(0,t0+dl);g.gain.linearRampToValueAtTime(.35,t0+dl+.02);g.gain.exponentialRampToValueAtTime(.001,t0+dl+.15);o.connect(g).connect(ac.destination);o.start(t0+dl);o.stop(t0+dl+.16)}t0+=.45}}
document.addEventListener('pointerdown',()=>{if(soundPref()&&isSup()&&(!AL.ac||AL.ac.state!=='running')){audioOn();setTimeout(renderAlerts,50)}},true);
function alertTick(d){if(!me||!isSup())return 0;const L=alertsOf(d),ids=new Set(L.map(c=>c.id));
 const Mu=mutedSet(),fresh=L.filter(c=>!AL.seen.has(c.id)&&!Mu.has(c.id));for(const c of L)if(Mu.has(c.id))AL.seen.add(c.id);for(const c of fresh)AL.seen.add(c.id);
 for(const id of [...AL.seen])if(!ids.has(id)){AL.seen.delete(id);AL.ack.delete(id)}
 const on=soundPref();
 if(fresh.length){if(on)beep(3);AL.lastBeep=now();const c=fresh[0];toast(t('Alerta: {n} esperando há {t}.',{n:c.customer.name,t:fmtDur(now()-waitStart(c))}))}
 else if(on&&L.some(c=>!AL.ack.has(c.id)&&!Mu.has(c.id))&&now()-AL.lastBeep>=60000){beep(2);AL.lastBeep=now()}
 const n=L.filter(c=>!AL.ack.has(c.id)&&!Mu.has(c.id)).length;
 const b=$('#cntAl');if(b){b.hidden=!L.length;b.textContent=L.length}return n}
function renderAlerts(){if(view!=='alertas'||!$('#alList'))return;const L=alertsOf(db),on=soundPref(),live=AL.ac&&AL.ac.state==='running';
 $('#alSub').textContent=t('Clientes esperando resposta há mais de {t}.',{t:fmtT(db.cfg.alert||300)});
 $('#alSound').innerHTML=on?`<span class="snd on">${t('Som ativado')}</span>${live?'':`<span class="mute" style="font-size:13px">${t('Clique em qualquer lugar para reativar o som.')}</span>`}<button class="btn" data-act="sndTest">${t('Testar som')}</button><button class="btn" data-act="sndToggle">${t('Desativar som')}</button>`
  :`<span class="snd">${t('Som desativado')}</span><button class="btn pri" data-act="sndToggle">${t('Ativar som')}</button>`;
 $('#alList').innerHTML=L.length?L.map(c=>{const a=c.agentId&&U(db,c.agentId),lm=c.msgs.filter(m=>m.from==='customer').slice(-1)[0],ack=AL.ack.has(c.id);
  return `<div class="alc ${ack?'ack':''}"><div class="alt"><b>${fmtDur(now()-waitStart(c))}</b><span>${t('Esperando')}</span></div>
  <div class="alm"><div class="r1"><b>${esc(c.customer.name)}</b> ${tagL(c.line)}</div><div class="mute" style="font-size:14px">${a?esc(t('Com {n}',{n:a.name})):t('Na fila')}</div>
  ${lm?`<div class="alq">${lm.file?esc(t('Anexo: {f}',{f:lm.file.name})):esc(lm.text)}</div>`:''}</div>
  <div class="ta"><button class="btn pri" data-act="alOpen" data-id="${c.id}">${t('Abrir conversa')}</button>${ack?`<span class="mute" style="font-size:13px">${t('Silenciado')}</span>`:`<button class="btn" data-act="alAck" data-id="${c.id}">${t('Ciente')}</button>`}</div></div>`}).join('')
  :`<div class="alok">${svg('bell')}<b>${t('Nenhum alerta agora. Tudo em dia.')}</b></div>`}

function foldersDef(){return role()==='agent'?[['mine','Meus'],['muted','Silenciados'],['all','Todos']]:[['mine','Meus'],['unassigned','Não atribuídos'],['team','Equipe'],['muted','Silenciados'],['all','Todos']]}
function inFolder(c,f){const M=mutedSet();return f==='mine'?c.status==='open'&&c.agentId===me:f==='unassigned'?c.status==='open'&&!c.agentId:f==='team'?c.status==='open'&&!!c.agentId&&c.agentId!==me:f==='muted'?M.has(c.id):true}
function passFilters(c){const F=IN.filt;
 if(F.lines.length&&!F.lines.includes(c.line))return false;
 if(F.status!=='any'&&c.status!==F.status)return false;
 if(F.agent&&!(c.agentId===F.agent||c.handled.includes(F.agent)))return false;
 if(F.lang&&c.customer.lang!==F.lang)return false;
 if(F.period==='today'&&new Date(c.createdAt).toDateString()!==new Date().toDateString())return false;
 if(F.period==='7d'&&now()-c.createdAt>7*864e5)return false;return true}
const filtCount=()=>{const F=IN.filt;return (F.lines.length?1:0)+(F.status!=='any'?1:0)+(F.agent?1:0)+(F.lang?1:0)+(F.period!=='any'?1:0)};
function matchQ(c,q){if(!q)return true;const d=q.replace(/^#/,'');
 if(q[0]==='#')return /^\d+$/.test(d)&&String(c.no??'').padStart(6,'0').includes(d);
 if(/^\d+$/.test(d)&&(String(c.no??'').padStart(6,'0').includes(d)||String(c.no)===String(Number(d))))return true;
 const s=q.toLowerCase();return c.customer.name.toLowerCase().includes(s)||(c.customer.phone||'').toLowerCase().includes(s)||(c.customer.pid||'').toLowerCase().includes(s)||c.msgs.some(m=>m.text&&m.from!=='system'&&m.text.toLowerCase().includes(s))}
function sortL(L){const k=IN.sort;return L.sort(k==='oldest'?(a,b)=>last(a).at-last(b).at:k==='wait'?(a,b)=>(waitStart(a)||1e15)-(waitStart(b)||1e15):(a,b)=>last(b).at-last(a).at)}
function listFor(f,qt,q){return db.chats.filter(c=>visible(c)&&(q?true:inFolder(c,f))&&passFilters(c)&&(qt==='unread'?unread(c)>0:qt==='pending'?pending(c):true)&&matchQ(c,q))}

const SAC_BASE=()=>NET?location.origin:'https://sac.example.com';
const GEN={line:null,lang:'auto',pos:'direita',id:false};
const ID_SNIP='\x3Cscript>\n  window.SAC = window.SAC || {};\n  SAC.jogador = { id: "PLAYER_ID", nome: "PLAYER_NAME" };\n\x3C/script>';
function genCode(){const L=LN(GEN.line)||LS()[0];if(!L)return '';
 return `\x3C!-- SAC · ${L.name} -->\n`+(GEN.id?ID_SNIP+'\n':'')+`\x3Cscript src="${SAC_BASE()}/widget.js"\n        data-linha="${L.id}"\n        data-idioma="${GEN.lang}"\n        data-posicao="${GEN.pos}"\n        async>\x3C/script>`}
const hl=s=>esc(s).replace(/(&lt;!--.*?--&gt;)/g,'<span class="c">$1</span>').replace(/(data-[a-z]+=&quot;[^&]*&quot;)/g,'<span class="a">$1</span>');
function renderGen(){const g=GI[lang],b=$('#genOut');if(!b)return;b.innerHTML=hl(genCode());const p=$('#genPrev');if(p)p.classList.toggle('left',GEN.pos==='esquerda')}
function renderGuide(){const g=GI[lang],o=GUIDE[lang];if(!GEN.line||!LN(GEN.line))GEN.line=LS()[0]?.id||null;
 const sec=(id,ti)=>`<h2 class="gsec" id="g-${id}">${ti}</h2>`;
 const toc=[['how',g.secHow],['gen',g.secGen],['steps',g.secSteps],['where',g.secWhere],['id',g.secId],['opts',g.secOpts],['trouble',g.secTrouble]];
 $('#guide').innerHTML=`<h1>${g.title}</h1><p class="mute" style="margin:0;max-width:70ch">${g.intro}</p>

 <h3 class="gsub">${g.secApi}</h3><div class="tw"><table class="stack"><thead><tr><th>${g.optHead[0]}</th><th>${g.optHead[3]}</th></tr></thead><tbody>
  ${['SAC.open()','SAC.close()','SAC.identify({ id, nome })','SAC.setLanguage("vi")'].map((c,i)=>`<tr><td><code>${esc(c)}</code></td><td>${esc(g.a[i])}</td></tr>`).join('')}</tbody></table></div>
 ${sec('trouble',g.secTrouble)}<div class="gfaq">${g.trouble.map(q=>`<details><summary>${esc(q[0])}</summary><p>${esc(q[1])}</p></details>`).join('')}</div>
 <h3 class="gsub">${g.secReq}</h3><ul class="greq">${g.req.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
 <h2 class="gsec">${o.st}</h2>
 <div class="cols"><div class="card"><h2><span class="dot on"></span>${o.ready}</h2><ul>${o.readyL.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
 <div class="card"><h2><span class="dot" style="background:var(--ink)"></span>${o.we}</h2><ul>${o.weL.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
 <div class="card"><h2><span class="dot" style="background:var(--bad)"></span>${o.you}</h2><ul>${o.youL.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>
 <div class="card" style="margin-top:14px;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap"><div><h2 style="margin:0 0 4px">${o.simT}</h2><p class="mute" style="margin:0;max-width:60ch">${o.simD}</p></div><div style="display:flex;gap:8px;flex-wrap:wrap">${LINES().map(l=>`<a class="btn pri" href="${siteHref(l)}" target="_blank" rel="opener" style="text-decoration:none">${o.simB} ${esc(l)}</a>`).join('')}</div></div>`;
 renderGen()}
Object.assign(A,{
 genPos:b=>{GEN.pos=b.dataset.v;document.querySelectorAll('[data-act=genPos]').forEach(x=>x.classList.toggle('on',x===b));renderGen()},
 copyGen:b=>{const o=GUIDE[lang],code=genCode(),done=()=>{b.textContent=o.copied;setTimeout(()=>b.textContent=o.copy,1600)};
  const sel=()=>{const p=$('#genOut');if(!p)return;const r=document.createRange();r.selectNodeContents(p);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Ctrl+C')};
  try{navigator.clipboard.writeText(code).then(done,sel)}catch(e){sel()}},
 gJump:b=>{const el=document.getElementById('g-'+b.dataset.k);if(el)el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}
});
document.addEventListener('change',e=>{const id=e.target.id;if(id==='genLine'){GEN.line=e.target.value;renderGen()}if(id==='genLang'){GEN.lang=e.target.value;renderGen()}if(id==='genId'){GEN.id=e.target.checked;renderGen()}});

/* ---------- server mode: the SAC talks to the real server (only in the server build) ---------- */
/* server messages, listed so the build checks their translations:
 t('Sem permissão.') t('Comando desconhecido.') t('Chat não encontrado.') t('Idioma inválido.') t('Arquivo inválido.')
 t('Muitas tentativas. Tente de novo em 15 minutos.') t('Erro interno.') t('Linha não encontrada.') */
const NETC={ws:null,seq:0,wait:new Map(),first:true,retry:0,closing:false,next:[]};
const afterState=()=>new Promise(r=>{NETC.next.push(r);setTimeout(r,1500)});
load=()=>db;
save=()=>{};
tx=fn=>{console.warn('[sac] tx() não é usado no modo servidor')};
online=(d,u)=>{const s=u&&d.sessions[u.id];return !!(s&&s.on)};
function netBanner(on){const w=$('#warn');if(!w)return;w.hidden=on;if(!on)w.textContent=t('Sem conexão com o servidor. Tentando reconectar…')}
function cmd(name,args){return new Promise((res,rej)=>{const ws=NETC.ws;if(!ws||ws.readyState!==1){toast(t('Sem conexão com o servidor. Tentando reconectar…'));return rej(new Error('offline'))}
 const id=++NETC.seq;NETC.wait.set(id,{res,rej});ws.send(JSON.stringify({t:'cmd',id,cmd:name,args}))})}
async function run(name,args,okMsg){try{const r=await cmd(name,args);if(okMsg)toast(typeof okMsg==='function'?okMsg(r):okMsg);return r||true}catch(e){if(e&&e.key)toast(t(e.key,e.params));return null}}
function connect(){
 const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');NETC.ws=ws;NETC.closing=false;
 ws.onopen=()=>{NETC.retry=0;netBanner(true)};
 ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}
  if(m.t==='state'){const s=m.state;SKEW=s.serverNow-Date.now();db=s;me=s.me;
   NETC.next.splice(0).forEach(f=>f());
   if(NETC.first){NETC.first=false;const u=ME();if(u&&u.lang&&u.lang!==lang)setLang(u.lang);known=new Set(db.chats.filter(c=>c.agentId===me&&c.status==='open').map(c=>c.id));enter()}else render();return}
  if(m.t==='res'){const w=NETC.wait.get(m.id);if(!w)return;NETC.wait.delete(m.id);m.ok?w.res(m.data):w.rej({key:m.error,params:m.params});return}
  if(m.t==='bye'){NETC.closing=true;const msg=m.reason==='kicked'?t('Você foi desconectado por um supervisor.'):m.reason==='password'?t('Sua senha foi alterada. Entre de novo.'):t('Seu acesso foi removido.');netLogoutLocal(msg)}};
 ws.onclose=ev=>{for(const w of NETC.wait.values())w.rej({key:'Sem conexão com o servidor. Tentando reconectar…'});NETC.wait.clear();
  if(NETC.closing||ev.code===4000||ev.code===4001)return;
  if(ev.code===1006&&!me&&NETC.first){showLogin();return}
  netBanner(false);const d=Math.min(10000,1000*2**NETC.retry++);setTimeout(async()=>{const r=await fetch('/api/me').then(x=>x.json()).catch(()=>null);if(r&&r.ok===false){netLogoutLocal(t('Sua sessão expirou. Entre de novo.'));return}connect()},d)}}
function netLogoutLocal(msg){NETC.closing=true;try{NETC.ws&&NETC.ws.close()}catch(e){}me=null;db=null;sel=null;pend=null;NETC.first=true;document.title='SAC';if(typeof AL!=='undefined'){AL.seen.clear();AL.ack.clear()}mclose();netBanner(true);showLogin(msg)}
logout=async msg=>{NETC.closing=true;await fetch('/api/logout',{method:'POST'}).catch(()=>{});netLogoutLocal(msg)};
A.logout=()=>logout();

/* login */
F.fLogin=async()=>{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#lEmail').value,password:$('#lPass').value})}).then(x=>x.json()).catch(()=>null);
 if(!r){$('#lErr').textContent=t('Sem conexão com o servidor. Tentando reconectar…');return}
 if(!r.ok){$('#lErr').textContent=t(r.error||'E-mail ou senha incorretos.');return}
 NETC.first=true;connect()};

/* language, profile, password, settings */
const _setLang=setLang;
setLang=(l,persist)=>{_setLang(l,false);if(persist&&me){const u=ME();if(u)u.lang=l;cmd('setLang',{lang:l}).catch(()=>{})}};
F.fProfile=()=>run('profile',{name:$('#pfName').value},t('Perfil salvo.'));
F.fOwnPass=async()=>{const n=$('#op1').value;if(n.length<6)return $('#oErr').textContent=t('Mínimo 6 caracteres.');if(n!==$('#op2').value)return $('#oErr').textContent=t('As senhas não conferem.');
 try{await cmd('ownPass',{old:$('#op').value,pass:n});$('#fOwnPass').reset();$('#oErr').textContent='';toast(t('Sua senha foi alterada.'))}catch(e){if(e&&e.key)$('#oErr').textContent=t(e.key,e.params)}};
F.fCfg=()=>run('cfg',{key:'timeout',value:$('#cfgT').value},r=>t('Tempo sem resposta: {t}.',{t:fmtT(r.value)}));
F.fAlert=()=>run('cfg',{key:'alert',value:$('#cfgA').value},r=>t('Alerta de demora: {t}.',{t:fmtT(r.value)}));
F.fMax=()=>run('cfg',{key:'maxChats',value:$('#cfgM').value},r=>r.value?t('Limite de chats: {n}.',{n:r.value}):t('Sem limite'));

/* users and lines */
F.fNewUser=async f=>{const r=$('#nuRole').value,em=$('#nuEmail').value.trim().toLowerCase();
 const ok=await run('userCreate',{name:$('#nuName').value,email:em,pass:$('#nuPass').value,role:r,lines:[...document.querySelectorAll('[name=nuL]:checked')].map(x=>x.value)},t('{r} criado: {e}',{r:rl(r),e:em}));
 if(ok){f.reset();document.querySelectorAll('[name=nuL]').forEach(x=>x.checked=true);$('#nuRole').value='agent'}};
A.doEdit=async b=>{const ok=await run('userEdit',{userId:b.dataset.id,name:$('#eName').value,email:$('#eEmail').value,role:$('#eRole').value,lines:[...document.querySelectorAll('[name=eL]:checked')].map(x=>x.value)},t('Acesso atualizado.'));if(ok)mclose()};
A.doDel=async b=>{if(await run('userDel',{userId:b.dataset.id},t('Acesso excluído.')))mclose()};
A.doPass=async b=>{const a=$('#np1').value,c=$('#np2').value;if(a.length<6)return $('#pErr').textContent=t('Mínimo 6 caracteres.');if(a!==c)return $('#pErr').textContent=t('As senhas não conferem.');
 if(await run('setPass',{userId:b.dataset.id,pass:a},t('Senha alterada.')))mclose()};
A.kick=async b=>{await run('kick',{userId:b.dataset.id},r=>t('{n} foi desconectado.',{n:r.name}))};
F.fLine=async f=>{const id=$('#lnId').value.trim();const ok=await run('lineCreate',{id,name:$('#lnName').value,color:document.querySelector('[name=lnC]:checked')?.value},t('Linha {l} criada.',{l:id}));if(ok)f.reset()};
A.doEditLine=async b=>{if(await run('lineEdit',{id:b.dataset.id,name:$('#elName').value,color:document.querySelector('[name=elC]:checked')?.value},t('Linha atualizada.')))mclose()};
A.doDelLine=async b=>{if(await run('lineDel',{id:b.dataset.id},t('Linha excluída.')))mclose()};

/* chats */
send=async()=>{const c=db.chats.find(x=>x.id===sel),m=$('#txt').value.trim();if(!c||!canReply(c)||(!m&&!pend))return;
 const file=pend;$('#txt').value='';pend=null;$('#att').innerHTML='';
 const ok=await run('send',{chatId:c.id,text:m,file});if(!ok){$('#txt').value=m}};
A.send=send;
A.take=()=>run('take',{chatId:sel},t('Chat assumido.'));
A.doTransfer=async b=>{const ok=await run('transfer',{chatId:sel,to:b.dataset.to},t('Chat transferido.'));mclose();if(ok&&role()==='agent'){sel=null;render()}};
A.doClose=async()=>{const r=$('#reason').value.trim();if(role()==='agent'&&r.length<5){$('#rErr').textContent=t('Escreva a justificativa (mínimo 5 caracteres).');return}
 if(await run('close',{chatId:sel,reason:r},t('Chat encerrado.')))mclose()};
A.pauseToggle=()=>run('pause',{},r=>r.pause?t('Você está em pausa: não recebe chats novos.'):t('Você está disponível para novos chats.'));
A.mute=()=>run('mute',{chatId:sel},r=>r.muted?t('Chat silenciado.'):t('Som do chat reativado.'));
markRead=c=>{if(!c||unread(c)===0)return false;const u=ME();if(u){u.read=u.read||{};u.read[c.id]=now()}cmd('read',{chatId:c.id}).catch(()=>{});return true};
A.readAll=()=>{const u=ME();if(u){u.read=u.read||{};for(const c of db.chats)u.read[c.id]=now()}IN.pop=null;renderPop2();renderList();run('readAll',{},t('Todas marcadas como lidas.'))};
A.saveSc=async()=>{const ti=$('#scT').value.trim(),te=$('#scX').value.trim();if(!ti||!te)return toast(t('Preencha título e texto.'));
 const w=afterState();if(await run('scriptSave',{id:editSc,title:ti,text:te},t('Script salvo.'))){await w;editSc=null;renderPop()}};
A.delSc=async b=>{const w=afterState();await run('scriptDel',{id:b.dataset.id});await w;renderPop()};

/* simulator */
F.fSimNew=async f=>{const r=await run('simNew',{name:$('#snName').value,phone:$('#snPhone').value,line:$('#snLine').value,msg:$('#snMsg').value});
 if(r){toast(r.agent?t('Chat aberto e atribuído a {n}.',{n:r.agent}):t('Chat aberto. Sem agente disponível na linha {l}: ficou na fila.',{l:r.line}));f.reset()}};
F.fSimMsg=async()=>{const id=$('#smChat').value,m=$('#smMsg').value.trim();if(!id||!m)return;if(await run('simMsg',{chatId:id,msg:m},t('Mensagem do cliente enviada.')))$('#smMsg').value=''};

/* start */
(async()=>{document.documentElement.lang=loc();const r=await fetch('/api/me').then(x=>x.json()).catch(()=>null);if(r&&r.ok)connect();else showLogin()})();

}
