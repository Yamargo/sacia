<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
:root{--mint:#b8f5d0;--mintInk:#0b3d24;--bad:#d4382a;--h:'Space Grotesk',system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font:16px/1.45 Inter,system-ui,-apple-system,'Segoe UI',sans-serif;color:#0b0b0c;background:#fff;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
input,textarea{font-size:16px;background:#fff;border:1px solid #d8d8d4;border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:none}
:focus-visible{outline:2px solid #0b0b0c;outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;position:relative}
.wh{background:#0b0b0c;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 6px 10px 14px;display:flex;align-items:center;gap:10px;flex:none}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--mint);color:var(--mintInk);display:grid;place-items:center;font-weight:600}
.wt{flex:1;min-width:0}.wt b{display:block;font:700 17px var(--h)}.wt span{display:block;font-size:13px;color:#b5b5bd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wib{min-width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:3px;color:#fff;flex:none;padding:0 6px}
.wib:hover{background:#ffffff1a}.wib svg{width:22px;height:22px}.wib em{font:600 11px Inter,sans-serif;font-style:normal}
.wib.dark{color:#0b0b0c}.wib.dark:hover{background:#0000000d}
.wlang{flex:1;overflow:auto;padding:20px 16px;display:grid;gap:10px;align-content:start}
.wlang h3{font:500 14px/1.5 Inter,sans-serif;margin:0 0 6px;color:#66666c}
.wlb{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:62px;padding:12px 16px;border:1px solid #d8d8d4;border-radius:14px;text-align:left}
.wlb b{font:700 19px var(--h)}.wlb span{font-size:13px;color:#66666c;text-align:right}.wlb.on{border-color:#0b0b0c;box-shadow:inset 0 0 0 1px #0b0b0c}.wlb:hover{background:#f4f4f2}
.wstart{flex:1;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.wlead{margin:0 0 14px}
label.f{display:block;font-size:13px;color:#66666c;margin:0 0 12px}label.f>input,label.f>textarea{margin-top:4px;color:#0b0b0c}
.wgo{width:100%;min-height:50px;border-radius:14px;background:#0b0b0c;color:#fff;font-weight:600;display:block}.wgo:disabled{opacity:.6}
.wgo.ghost{background:#f1f1ef;color:#0b0b0c}.wgo.bad{background:var(--bad)}
.wbody{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:#f4f4f2}
.wm{max-width:82%;width:fit-content;flex:none;padding:9px 12px;border-radius:14px;background:#fff;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 1px 0 #e3e3df}
.wm.p{align-self:flex-end;background:var(--mint);color:var(--mintInk)}
.wm small{display:block;font-size:11px;opacity:.6;margin-top:2px}
.wm img{display:block;max-width:100%;max-height:260px;border-radius:8px;margin-bottom:4px}
.wfile{display:flex;align-items:center;gap:6px;font-weight:600;margin-bottom:4px;color:inherit}.wfile svg{width:16px;height:16px}
.wsys{align-self:center;font-size:12px;color:#66666c;text-align:center}
.watt{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-top:1px solid #e3e3df;font-size:14px}
.watt img{width:44px;height:44px;object-fit:cover;border-radius:8px}.watt span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.watt>svg{width:20px;height:20px}
#wAtt:empty{display:none}
.wf{display:flex;align-items:flex-end;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #e3e3df;flex:none}
.wf textarea{min-height:44px;height:44px;max-height:120px;border-radius:22px;padding:10px 16px;line-height:1.4}
.wsend{width:44px;height:44px;border-radius:50%;background:#0b0b0c;color:#fff;display:grid;place-items:center;flex:none}.wsend svg{width:20px;height:20px}
.wend{display:grid;gap:12px;padding:16px 16px calc(16px + env(safe-area-inset-bottom));font-size:15px;color:#3a3a40;text-align:center;border-top:1px solid #e3e3df;flex:none}
.wconf{position:absolute;inset:0;background:#0b0b0c99;display:flex;align-items:flex-end;z-index:3}
.wconf>div{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom))}
.wconf b{font:700 19px var(--h);display:block}.wconf p{margin:6px 0 16px;color:#66666c;font-size:15px}
.wconfb{display:flex;gap:10px}
.wnet{position:absolute;left:12px;right:12px;bottom:76px;background:#0b0b0c;color:#fff;font-size:13px;padding:8px 12px;border-radius:10px;text-align:center}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#0b0b0c;color:#fff;padding:10px 14px;border-radius:12px;font-size:14px;max-width:90vw;z-index:9}
</style>
</head>

", "Passwords match nahin karte.", "两次密码不一致。"], ["Assumido por {a}.", "Taken over by {a}.", "{a} đã nhận chat.", "{a} ne chat le liya.", "由 {a} 接手。"], ["Assumir", "Take over", "Nhận chat", "Le len", "接手"], ["Atendido por", "Handled by", "Được xử lý bởi", "Kis ne attend kiya", "接待人员"], ["Atendimento", "Inbox", "Hộp chat", "Inbox", "会话"], ["Atendimento encerrado. Obrigado pelo contato!", "Chat ended. Thank you for contacting us!", "Cuộc trò chuyện đã kết thúc. Cảm ơn bạn đã liên hệ!", "Chat khatam ho gayi. Rabta karne ka shukriya!", "会话已结束，感谢您的联系！"], ["Atribuído a {b}.", "Assigned to {b}.", "Đã giao cho {b}.", "{b} ko assign kiya gaya.", "已分配给 {b}。"], ["Aventura", "Adventure", "Phiêu lưu", "Adventure", "冒险"], ["Ações", "Actions", "Thao tác", "Actions", "操作"], ["Boa tarde, preciso de ajuda com a minha fatura.", "Good afternoon, I need help with my bill.", "Chào buổi chiều, tôi cần hỗ trợ về hóa đơn.", "Assalam o alaikum, mujhe apne bill mein madad chahiye.", "下午好，我的账单需要帮助。"], ["Buscar nome, telefone ou ID", "Search name, phone or ID", "Tìm tên, số điện thoại hoặc ID", "Naam, phone ya ID talash karen", "搜索姓名、电话或 ID"], ["Cada aba deste navegador guarda um login próprio. Abra este mesmo link em outras abas (normais, não anônimas) e entre com o agente, o supervisor e o admin. Todos veem os mesmos dados ao vivo.", "Each tab in this browser keeps its own login. Open this same link in other tabs (normal, not incognito) and sign in as the agent, the supervisor and the admin. Everyone sees the same live data.", "Mỗi tab trong trình duyệt này giữ một lần đăng nhập riêng. Mở cùng liên kết này ở các tab khác (tab thường, không ẩn danh) và đăng nhập bằng nhân viên, giám sát viên và quản trị viên. Mọi người đều thấy cùng dữ liệu theo thời gian thực.", "Is browser ka har tab apna alag login rakhta hai. Yehi link doosre tabs mein kholen (normal, incognito nahin) aur agent, supervisor aur admin se login karen. Sab ko live wahi data nazar aata hai.", "此浏览器的每个标签页各自保存登录状态。在其他标签页（普通模式，非无痕） let tt;function toast(m){const x=$('#toast');x.textContent=m;x.hidden=false;clearTimeout(tt);tt=setTimeout(()=>x.hidden=true,3200)}

function build(){const k={n:$('#wName')?.value||W.player?.nome||'',p:$('#wPid')?.value||W.player?.id||'',f:$('#wFirst')?.value||'',x:$('#wTxt')?.value||''};
 document.documentElement.lang=LANGS.find(l=>l[0]===wl())[2];
 $('#app').innerHTML=`<div class="wh"><span class="av">S</span><div class="wt"><b>${t('Suporte')}</b><span id="wStatus"></span></div>
  ${FIXED?'':`<button class="wib" data-act="pick" aria-label="${t('Idioma')}" title="${t('Idioma')}">${ic('globe')}<em>${wl().toUpperCase()}</em></button>`}
  <button class="wib" id="wEndBtn" data-act="askEnd" aria-label="${t('Encerrar conversa')}" title="${t('Encerrar conversa')}" hidden>${ic('end')}</button>
  <button class="wib" data-act="close" aria-label="${t('Fechar')}">${ic('down')}</button></div>
 <div class="wconf" id="wConf" hidden><div><b>${t('Encerrar esta conversa?')}</b><p>${t('Você pode abrir uma nova conversa quando quiser.')}</p>
  <div class="wconfb"><button class="wgo ghost" data-act="noEnd">${t('Cancelar')}</button><button class="wgo bad" data-act="doEnd">${t('Encerrar')}</button></div></div></div>

 <form class="wstart" id="wStart"><p class="wlead">${t('Olá! Conte o que aconteceu e um atendente responde por aqui.')}</p>

  <button class="wgo">${t('Iniciar conversa')}</button></form>
 <div class="wbody" id="wMsgs" hidden aria-live="polite"></div><div id="wAtt"></div>
 <div class="wf" id="wComp" hidden><label class="wib dark" aria-label="${t('Enviar imagem ou arquivo')}" title="${t('Enviar imagem ou arquivo')}">${ic('clip')}<input type="file" id="wFile" hidden></label>
  <textarea id="wTxt" rows="1" maxlength="4000" placeholder="${t('Escreva sua mensagem')}" enterkeyhint="send">${esc(k.x)}</textarea>

 W.lastK='';render()}

function render(){const s=W.st;if(!$('#wLang'))return;const c=s&&s.chat,pick=!W.lang||W.picking;
 $('#wLang').hidden=!pick;$('#wStart').hidden=pick||!!c;$('#wMsgs').hidden=pick||!c;$('#wComp').hidden=pick||!(c&&c.status==='open');$('#wEnd').hidden=pick||!(c&&c.status==='closed');$('#wAtt').hidden=pick;
 $('#wEndBtn').hidden=pick||!(c&&c.status==='open');if(!(c&&c.status==='open'))W.conf=false;$('#wConf').hidden=!W.conf;
 if(c&&c.status==='closed')$('#wEndTxt').textContent=c.closedBy==='customer'?t('Você encerrou a conversa.')+' '+t('Você pode abrir uma nova conversa quando quiser.'):t('Atendimento encerrado. Obrigado pelo contato!');
 const n=s?s.online:0;
 $('#wStatus').textContent=s&&!s.exists?t('Linha não encontrada.'):c&&c.status==='open'&&c.agent?t('Falando com {n}',{n:c.agent}):c&&c.status==='open'?t('Aguardando um atendente…'):n>1?t('{n} atendentes online',{n}):n===1?t('1 atendente online'):t('Deixe sua mensagem, respondemos em breve');
 const ag=c?c.msgs.filter(m=>m.from==='agent').length:0;
 if(W.seen<0||W.open)W.seen=ag;toParent({type:'unread',n:Math.max(0,ag-W.seen)});
 if(!c)return;const box=$('#wMsgs'),k=wl()+':'+c.id+':'+c.msgs.length+':'+c.status+':'+(c.agent||'');if(W.lastK===k)return;W.lastK=k;
 box.innerHTML=c.msgs.map(m=>`<div class="wm ${m.from==='customer'?'p':''}">${m.file?(m.file.type.startsWith('image/')?`<a href="${esc(m.file.data)}" target="_blank" rel="noopener"><img src="${esc(m.file.data)}" alt="${esc(m.file.name)}"></a>`:`<a class="wfile" href="${esc(m.file.data)}" target="_blank" rel="noopener">${ic('clip')}${esc(m.file.name)}</a>`):''}${m.text?esc(m.text):''}<small>${m.by?esc(m.by)+' · ':''}${hm(m.at)}</small></div>`).join('')
  +(c.status==='open'&&c.queue?`<div class="wsys">${t('Você está na fila. Um atendente vai falar com você em instantes.')}</div>`:'');
 box.scrollTop=box.scrollHeight}

function connect(){const tok=ls.get(TOK)||'';const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/wsc?line='+encodeURIComponent(LINE)+(tok?'&token='+encodeURIComponent(tok):''));W.ws=ws;
 ws.onopen=()=>{W.retry=0;const n=$('#wNet');if(n)n.hidden=true};
 ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}
  if(m.t==='cstate'){W.st=m.state;W.skew=m.state.serverNow-Date.now();if(tok&&!m.state.chat)ls.set(TOK,null);render();return}
  if(m.t==='res'){const w=W.wait.get(m.id);if(!w)return;W.wait.delete(m.id);m.ok?w.res(m.data):w.rej({key:m.error,params:m.params})}};
 ws.onclose=ev=>{for(const w of W.wait.values())w.rej({key:'Sem conexão com o servidor. Tentando reconectar…'});W.wait.clear();if(ev.code===4900)return;const n=$('#wNet');if(n)n.hidden=false;setTimeout(connect,Math.min(10000,1000*2**W.retry++))}}
function cmd(name,args){return new Promise((res,rej)=>{if(!W.ws||W.ws.readyState!==1)return rej({key:'Sem conexão com o servidor. Tentando reconectar…'});const id=++W.seq;W.wait.set(id,{res,rej});W.ws.send(JSON.stringify({t:'cmd',id,cmd:name,args}))})}
async function run(name,args){try{return (await cmd(name,args))||true}catch(e){toast(t(e.key||'Erro interno.',e.params));return null}}
function grow(){const x=$('#wTxt');if(!x)return;x.style.height='auto';x.style.height=Math.min(x.scrollHeight,120)+'px'}
async function send(){const m=$('#wTxt').value.trim(),c=W.st&&W.st.chat;if((!m&&!W.pend)||!c||c.status!=='open')return;const file=W.pend;$('#wTxt').value='';W.pend=null;$('#wAtt').innerHTML='';grow();
 if(!(await run('send',{text:m,file}))&&m)$('#wTxt').value=m;$('#wTxt').focus()}

 send,

  if(W.player){$('#wName').value=W.player.nome||'';$('#wPid').value=W.player.id||''}$('#wAtt').innerHTML='';try{W.ws.onclose=null;W.ws.close(4900)}catch(e){}connect();render()},

 if(f.size>10*1024*1024)return toast(t('Arquivo acima de {n} MB.',{n:10}));
 const r=new FileReader();r.onload=()=>{W.pend={name:f.name,type:f.type||'application/octet-stream',size:f.size,data:r.result};
  $('#wAtt').innerHTML=`<div class="watt">${f.type.startsWith('image/')?`<img src="${r.result}" alt="">`:ic('clip')}<span>${esc(f.name)}</span><button class="wib dark" data-act="rmAtt" aria-label="${t('Remover anexo')}">${ic('x')}</button></div>`};r.readAsDataURL(f)});
addEventListener('message',e=>{const m=e.data;if(!m||!m.sac||e.source!==parent)return;
 if(m.type==='open'){W.open=!!m.v;if(W.open){render();const f=!$('#wStart').hidden?$('#wName'):!$('#wComp').hidden?$('#wTxt'):null;if(f&&innerWidth>600)f.focus()}}
 if(m.type==='player'&&m.player&&typeof m.player==='object'){W.player={id:String(m.player.id||'').slice(0,80),nome:String(m.player.nome||m.player.name||'').slice(0,80)};const n=$('#wName'),p=$('#wPid');if(n&&!n.value)n.value=W.player.nome;if(p&&!p.value)p.value=W.player.id}
 if(m.type==='lang'&&WL.includes(m.l)){A.setLang({dataset:{l:m.l}})}});
function start(){build();connect();toParent({type:'ready'})}

start();
}
</script>
